include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - public_member_api_docs
    - avoid_print
    - prefer_final_locals
    - prefer_final_in_for_each
    - unawaited_futures

analyzer:
  exclude:
    - build/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
